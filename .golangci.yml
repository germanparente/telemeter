linters:
  # disable-all: true
  # enable-all: true
  disable:
    - megacheck
  enable:
    # megacheck fails to respect build flags, causing compilation failure during linting.
    # instead, use the unused, gosimple, and staticcheck linters directly
    - gosimple
    - staticcheck
    - unused
linters-settings:
  errcheck:
    exclude-functions:
      - (github.com/go-kit/log.Logger).Log
      - (github.com/openshift/telemeter/vendor/github.com/go-kit/log.Logger).Log
  govet:
    # disable for those few tests calling t.Fatal from withing go routine.
    disable:
      - testinggoroutine
